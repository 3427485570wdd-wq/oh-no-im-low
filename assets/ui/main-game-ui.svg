<title id="ui-title-description">OH NO, I'M LOW! 主界面固定图层</title>
<desc id="ui-description">透明背景的可编辑主界面SVG，包含标题、无数字状态条、暂停、重新校准、操作提示、补充记录、进食区。嘴巴闭合与张开分别保存在mouth-closed、mouth-open图层，修改display可切换；默认闭合。所有文字可直接编辑。图层保持屏幕坐标，桌面缩放和平移独立实现。</desc>
